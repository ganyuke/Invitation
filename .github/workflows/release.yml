name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build JARs
        run: ./gradlew :spigot:build :fabric:build :neoforge:build --no-daemon

      - name: Collect release JARs
        shell: bash
        run: |
          mkdir -p artifacts

          find {fabric,neoforge,spigot}/build/libs -name "*.jar" -exec cp -t artifacts/ {} +

          echo "Release artifacts:"
          ls -lh artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-jars
          path: artifacts/*.jar
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*.jar
