name: Invitation
version: ${version}
main: io.github.ganyuke.invitation.Invitation
api-version: 1.17

commands:
  invite:
    description: Add a player to the whitelist and log it.
    usage: /invite <player>
    permission: invite.use
  invitelog:
    description: Show recent invite logs (optionally for a player).
    usage: /invitelog [player]
    permission: invite.log

permissions:
  invite.use:
    description: Allows using /invite
    default: true
  invite.log:
    description: Allows using /invitelog
    default: op
